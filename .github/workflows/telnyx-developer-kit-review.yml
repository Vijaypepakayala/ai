name: Telnyx Developer Kit Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_hosted_audit:
        description: 'Validate the deployed MCP review contract with reviewer-safe reads'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  package-validation:
    name: Developer Kit package (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install PyYAML==6.0.3
      - name: Validate Codex developer-kit package
        run: python3 scripts/check-codex-plugin.py
      - name: Validate hosted MCP auditor fixtures
        run: python3 scripts/check-telnyx-mcp-catalog.py --self-test

  hosted-mcp-audit:
    name: Hosted MCP Release Audit (metadata only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_hosted_audit == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate deployed review metadata and endpoint schemas
        run: python3 ./scripts/check-telnyx-mcp-catalog.py
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
