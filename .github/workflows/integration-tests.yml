name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_write_tests:
        description: 'Run write tests (creates and cleans up real resources)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_mcp_catalog_audit:
        description: 'Validate hosted MCP review metadata and every endpoint schema'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  claude-plugin-check:
    name: Check — Claude Developer Kit contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate marketplace and Developer Kit plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.97 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.97 plugin validate providers/claude/plugins/telnyx-developer-kit
      - name: Verify documentation-only MCP contract
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const manifest = require('./providers/claude/plugins/telnyx-developer-kit/.claude-plugin/plugin.json');
          const builder = fs.readFileSync(
            './providers/claude/plugins/telnyx-developer-kit/agents/telnyx-builder.md',
            'utf8',
          );
          const mcp = manifest.mcpServers?.telnyx;

          assert.deepEqual(
            mcp,
            { type: 'http', url: 'https://api.telnyx.com/v2/mcp' },
            'The public MCP must use its OAuth flow and must not forward a configured API key',
          );
          assert.equal(manifest.userConfig, undefined, 'The plugin must not collect a Telnyx API key');
          assert.match(manifest.description, /API documentation and focused read-only account tools/i);

          for (const requiredValue of ['`telnyx__search`', '`telnyx__retrieve`']) {
            assert.ok(builder.includes(requiredValue), `Builder guidance must include ${requiredValue}`);
          }
          assert.match(builder, /public MCP catalog is\s+documentation-only/i);
          assert.doesNotMatch(builder, /invoke_api_endpoint/i);
          assert.doesNotMatch(builder, /For live API work/i);
          NODE

  skills-sync-check:
    name: Check — Skills in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install plugin validation dependencies
        run: python -m pip install PyYAML==6.0.3
      - name: Verify provider skill directories match source
        run: ./scripts/check-skills-sync.sh
      - name: Validate Codex developer-kit package
        run: python3 scripts/check-codex-plugin.py
      - name: Validate hosted MCP auditor fixtures
        run: python3 scripts/check-telnyx-mcp-catalog.py --self-test

  skill-count-check:
    name: Check — Skill-count markers current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify SKILL_COUNT markers match on-disk count
        run: ./scripts/check-skill-count.sh

  unit-tests:
    name: Unit Tests (no API key)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Python unit tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        working-directory: tools/python
        run: pip install -e ".[dev]"
      - name: Python unit tests
        working-directory: tools/python
        run: pytest tests/test_tools.py tests/test_configuration.py tests/test_api_client.py tests/test_openai_toolkit.py tests/test_langchain_toolkit.py tests/test_crewai_toolkit.py tests/test_shared_schema.py tests/test_x402.py tests/test_rcs_call_control_tools.py -v

      # TypeScript compilation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install TS SDK deps
        working-directory: tools/typescript
        run: npm ci
      - name: TypeScript SDK compilation
        working-directory: tools/typescript
        run: npx tsc --noEmit
      - name: TypeScript adapter contract tests
        working-directory: tools/typescript
        run: npx tsx tests/rcs-call-control.test.ts && npx tsx tests/adapter-anyof.test.ts
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: CLI compilation
        working-directory: cli
        run: npx tsc --noEmit
      - name: CLI unit tests
        working-directory: cli
        run: npm test

      # Cross-package parity
      - name: Cross-package parity check
        run: |
          PY_TOOLS=$(cd tools/python && python3 -c "
          from telnyx_agent_toolkit.shared.constants import TOOL_DEFINITIONS
          print('\n'.join(sorted(TOOL_DEFINITIONS)))
          ")
          TS_TOOLS=$(cd tools/typescript && npx tsx -e "
          import { TOOL_DEFINITIONS } from './src/shared/constants.ts';
          console.log(Object.keys(TOOL_DEFINITIONS).sort().join('\n'));
          ")
          if [ "$PY_TOOLS" != "$TS_TOOLS" ]; then
            echo "MISMATCH! Missing from TypeScript:"
            comm -23 <(printf '%s\n' "$PY_TOOLS") <(printf '%s\n' "$TS_TOOLS")
            echo "MISMATCH! Missing from Python:"
            comm -13 <(printf '%s\n' "$PY_TOOLS") <(printf '%s\n' "$TS_TOOLS")
            exit 1
          fi
          TOOL_COUNT=$(printf '%s\n' "$PY_TOOLS" | wc -l | tr -d ' ')
          echo "✅ Python and TypeScript SDKs have identical tool sets ($TOOL_COUNT tools each)"

      # Guide structural tests
      - name: Guide structural tests
        run: npx tsx --test tests/guides.test.ts

  mcp-app-tests:
    name: MCP Apps (no API key)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install MCP Apps dependencies
        working-directory: tools/mcp-apps
        run: npm ci
      - name: Audit MCP Apps production dependencies
        working-directory: tools/mcp-apps
        run: npm audit --omit=dev --audit-level=moderate
      - name: Type-check MCP Apps
        working-directory: tools/mcp-apps
        run: npm run typecheck
      - name: Build MCP Apps
        working-directory: tools/mcp-apps
        run: npm run build
      - name: Test MCP Apps
        working-directory: tools/mcp-apps
        run: npm test

  api-readonly:
    name: API Read-Only Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
    # Never expose repository secrets to code from a pull_request event,
    # including branches from the same repository.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       (github.event.inputs.run_mcp_catalog_audit != 'true' ||
        github.event.inputs.run_write_tests == 'true'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Python read-only
      - name: Install Python deps
        working-directory: tools/python
        run: pip install -e ".[dev]"
      - name: Python API read-only tests
        working-directory: tools/python
        run: pytest tests/test_integration_ci.py -v -k "readonly"
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}

      # TS SDK read-only
      - name: Install TS SDK deps
        working-directory: tools/typescript
        run: npm ci
      - name: TS SDK API read-only tests
        working-directory: tools/typescript
        run: npx tsx tests/integration-ci.test.ts
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}

      # Install Go CLI (telnyx-cli)
      - name: Install telnyx CLI (Go)
        run: |
          cli_download_dir="$(mktemp -d)"
          cli_archive="$cli_download_dir/telnyx.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$cli_archive" https://github.com/team-telnyx/telnyx-cli/releases/download/v0.11.0/telnyx_0.11.0_linux_amd64.tar.gz
          printf '%s  %s\n' '9a4ea6023370f1a1da11157046c6f1fff34dc70d808076f6e8780c32a3581635' "$cli_archive" | sha256sum --check --strict
          tar -xzf "$cli_archive" -C /usr/local/bin telnyx
          chmod +x /usr/local/bin/telnyx
          telnyx --version

      # CLI read-only
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: CLI read-only tests
        working-directory: cli
        run: npx tsx tests/integration-ci.test.ts
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}

      # Guide API smoke tests
      - name: Guide API smoke tests
        run: npx tsx --test tests/guides-api.test.ts
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}

  mcp-catalog-audit:
    name: Hosted MCP Release Audit (metadata only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_mcp_catalog_audit == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate hosted review metadata and every endpoint schema
        run: python3 ./scripts/check-telnyx-mcp-catalog.py
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}

  api-write:
    name: API Write + Cleanup Tests (Telnyx network)
    runs-on: telnyx-2xsmall
    needs: api-readonly
    permissions:
      contents: read
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.run_write_tests == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Python write tests
      - name: Install Python deps
        working-directory: tools/python
        run: pip install -e ".[dev]"
      - name: Python API write tests
        working-directory: tools/python
        run: pytest tests/test_integration_ci.py -v -k "write"
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          RUN_WRITE_TESTS: "true"

      # TS SDK write tests
      - name: Install TS SDK deps
        working-directory: tools/typescript
        run: npm ci
      - name: TS SDK write tests
        working-directory: tools/typescript
        run: npx tsx tests/integration-ci.test.ts
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          RUN_WRITE_TESTS: "true"

      # Install Go CLI (telnyx-cli)
      - name: Install telnyx CLI (Go)
        run: |
          cli_download_dir="$(mktemp -d)"
          cli_archive="$cli_download_dir/telnyx.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$cli_archive" https://github.com/team-telnyx/telnyx-cli/releases/download/v0.11.0/telnyx_0.11.0_linux_amd64.tar.gz
          printf '%s  %s\n' '9a4ea6023370f1a1da11157046c6f1fff34dc70d808076f6e8780c32a3581635' "$cli_archive" | sha256sum --check --strict
          tar -xzf "$cli_archive" -C /usr/local/bin telnyx
          chmod +x /usr/local/bin/telnyx
          telnyx --version

      # CLI write tests
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: CLI write tests
        working-directory: cli
        run: npx tsx tests/integration-ci-write.test.ts
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          RUN_WRITE_TESTS: "true"
