            const payApiOnlyResult = JSON.parse(payApiOnlyValidation.stdout);
            assert.equal(
              payApiOnlyResult.checks.find((check) => check.name === 'invalid_telnyx_pay_endpoint')?.status,
              'fail',
            );
            const payApiOnlyLint = childProcess.spawnSync(
              'bash',
              [
                './skills/telnyx-twilio-migration/scripts/lint-telnyx-correctness.sh',
                payApiOnlyRoot,
                '--product',
                'pay',
                '--json',
              ],
              { encoding: 'utf8' },
            );
            assert.equal(payApiOnlyLint.status, 1, payApiOnlyLint.stderr || payApiOnlyLint.stdout);
            assert.equal(
              JSON.parse(payApiOnlyLint.stdout).checks.find((check) => check.name === 'invalid_telnyx_pay_endpoint')?.status,
              'issue',
            );
            const commentedEndpointRoot = path.join(payFixtureRoot, 'commented-pay-endpoint');
            fs.mkdirSync(commentedEndpointRoot);
            fs.writeFileSync(
              path.join(commentedEndpointRoot, 'pay.py'),
              '# Retired example: POST /v2/calls/example/pay\nurl = "https://api.telnyx.com/v2/calls/example/actions/pay"  # old /v2/calls/example/pay\n/*\nPOST /v2/calls/example/pay\n*/\n',
            );
            const commentedEndpointLint = childProcess.spawnSync(
              'bash',
              [
                './skills/telnyx-twilio-migration/scripts/lint-telnyx-correctness.sh',
                commentedEndpointRoot,
                '--product',
                'pay',
                '--json',
              ],
              { encoding: 'utf8' },
            );
            assert.equal(
              commentedEndpointLint.status,
              0,
              commentedEndpointLint.stderr || commentedEndpointLint.stdout,
            );
            assert.equal(
              JSON.parse(commentedEndpointLint.stdout).checks.find((check) => check.name === 'invalid_telnyx_pay_endpoint')?.status,
              'pass',
            );
            const commentedEndpointValidation = childProcess.spawnSync(
              'bash',
              [
                './skills/telnyx-twilio-migration/scripts/validate-migration.sh',
                commentedEndpointRoot,
                '--product',
                'pay',
                '--json',
              ],
              { encoding: 'utf8' },
            );
            assert.equal(
              commentedEndpointValidation.status,
              1,
              commentedEndpointValidation.stderr || commentedEndpointValidation.stdout,
            );
            assert.equal(
              JSON.parse(commentedEndpointValidation.stdout).checks.find((check) => check.name === 'invalid_telnyx_pay_endpoint')?.status,
              'pass',
            );

            const parserFailure = path.join(payFixtureRoot, 'unsupported-encoding.xml');
            fs.writeFileSync(
              parserFailure,
              '<?xml version="1.0" encoding="X-UNKNOWN"?><Response><Pay paymentConnector="Default"/></Response>',
            );
            const parserFailureValidation = childProcess.spawnSync(
              'bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', parserFailure],
              { encoding: 'utf8' },
            );
            assert.equal(parserFailureValidation.status, 1, parserFailureValidation.stderr || parserFailureValidation.stdout);
            assert.doesNotMatch(parserFailureValidation.stdout, /\[OK\]\s+<Pay>/);
            assert.match(parserFailureValidation.stdout, /XML parse error|parser failed/);

            const ktsResidualRoot = path.join(payFixtureRoot, 'kts-residual');
            fs.mkdirSync(ktsResidualRoot);
            fs.writeFileSync(
              path.join(ktsResidualRoot, 'migration.kts'),
              'import com.twilio.twiml.VoiceResponse\nval response = VoiceResponse.Builder().build()\n',
            );
            const ktsScan = path.join(ktsResidualRoot, 'twilio-scan.json');
            fs.writeFileSync(ktsScan, JSON.stringify({ products_used: ['pay'] }));
            const ktsValidation = childProcess.spawnSync(
              'bash',
              [
                './skills/telnyx-twilio-migration/scripts/validate-migration.sh',
                ktsResidualRoot,
                '--product',
                'pay',
                '--scan-json',
                ktsScan,
                '--json',
              ],
              { encoding: 'utf8' },
            );
            assert.equal(ktsValidation.status, 1, ktsValidation.stderr || ktsValidation.stdout);
            assert.equal(
              JSON.parse(ktsValidation.stdout).checks.find((check) => check.name === 'twilio_java_imports')?.status,
              'fail',
            );
            const ktsLint = childProcess.spawnSync(
              'bash',
              [
                './skills/telnyx-twilio-migration/scripts/lint-telnyx-correctness.sh',
                ktsResidualRoot,
                '--product',
                'all',
                '--json',
              ],
              { encoding: 'utf8' },
            );
            assert.equal(ktsLint.status, 1, ktsLint.stderr || ktsLint.stdout);
            assert.equal(
              JSON.parse(ktsLint.stdout).checks.find((check) => check.name === 'residual_twilio_imports')?.status,
              'issue',
            );
            for (const product of [
              'all',
              'voice',
              'twiml',
              'texml',
              'messaging',
              'verify',
              'webrtc',
              'sip',
              'sip-integrations',
              'fax',
              'video',
              'iot',
              'lookup',
              'numbers',
              'numbers-config',
              'porting-in',
              'porting-out',
              'pay',
              'webhook-validation',
              'conversations',
              'sync',
              'notify',
              'proxy',
              'autopilot',
              'taskrouter',
              'studio',
              'flex',
            ]) {
              const productLint = childProcess.spawnSync(
                'bash',
                [
                  './skills/telnyx-twilio-migration/scripts/lint-telnyx-correctness.sh',
                  payOnlyRoot,
                  '--product',
                  product,
                  '--json',
                ],
                { encoding: 'utf8' },
              );
              assert.notEqual(
                productLint.status,
                2,
                `linter rejected supported product ${product}: ${productLint.stderr || productLint.stdout}`,
              );
            }
            for (const product of ['voice', 'twiml', 'texml', 'pay']) {
              const productValidation = childProcess.spawnSync(
                'bash',
                [
                  './skills/telnyx-twilio-migration/scripts/validate-migration.sh',
                  payOnlyRoot,
                  '--product',
                  product,
                  '--json',
                ],
                { encoding: 'utf8' },
              );
              assert.notEqual(
                productValidation.status,
                2,
                `validator rejected scanner product ${product}: ${productValidation.stderr || productValidation.stdout}`,
              );
            }
          } finally {
            fs.rmSync(payFixtureRoot, { recursive: true, force: true });
          }
          for (const [label, text] of [
            ['migration validator', migrationValidator],
            ['correctness linter', correctnessLinter],
          ]) {
            assert.match(text, /Products:[^\n]*\bpay\b/i, `${label} must advertise Pay`);
            assert.match(
              text,
              /effective_filter="\$PRODUCT_FILTER"[\s\S]*effective_filter="voice"/,
              `${label} must route Pay through Voice\/TeXML checks`,
            );
          }
          assert.match(twilioMigration, /Pay human setup gate:[\s\S]*Payment Connector[\s\S]*test mode/i);
          assert.match(twilioMigration, /Pay migrations also require Python 3/i);
          assert.match(twilioMigration, /Never request or store processor\s+credentials/i);

          for (const [label, text] of [
            ['architecture patterns', architecturePatterns],
            ['debugging', debugging],
            ['Twilio switch', twilioSwitch],
            ['migration error mapping', errorCodeMapping],
          ]) {
            assert.match(
              text,
              /iterate every entry in\s+`data\.payload\.to`[\s\S]{0,180}`phone_number`/i,
              `${label} must preserve per-recipient delivery outcomes`,
            );
            assert.match(
              text,
              /to\[0\]\.status`[\s\S]{0,180}(?:only|sufficient only)[\s\S]{0,180}(?:one|exactly one) recipient/i,
              `${label} may use index zero only for guaranteed single-recipient sends`,
            );
          }

          const chooserRows = new Map(
            [...pluginChooser.matchAll(/^\| `(telnyx-[^`]+)` \|[^\n]+\| (\d+) \|$/gm)]
              .map(([, plugin, count]) => [plugin, Number(count)]),
          );
          assert.deepEqual(
            [...chooserRows.keys()].sort(),
            packagedPlugins,
            'The plugin chooser must list every packaged Telnyx plugin exactly once',
          );
          for (const plugin of packagedPlugins) {
            assert.equal(
              chooserRows.get(plugin),
              countPluginSkills(plugin),
              `The plugin chooser skill count for ${plugin} must match its payload`,
            );
            for (const [name, readme] of [
              ['root README', rootReadme],
              ['skills README', skillsReadme],
            ]) {
              assert.ok(
                readme.includes(`/plugin install ${plugin}@telnyx`),
                `${name} must include the install command for ${plugin}`,
              );
            }
          }

          assert.match(
            productNavigator,
            /\| Video rooms \|[^\n]+\| telnyx-webrtc plugin \|/,
            'Video users must be routed to the plugin that owns telnyx-video-* skills',
          );
          assert.doesNotMatch(
            productNavigator,
            /\| Video rooms \|[^\n]+\| telnyx-platform plugin \|/,
          );
          assert.match(
            productNavigator,
            /Deep-dive column[\s\S]*Claude Code[\s\S]*In Cursor,[\s\S]*do not run that command[\s\S]*already bundled/i,
            'Shared navigator guidance must distinguish Claude Code installation from Cursor skill loading',
          );

          assert.match(twilioSwitch, /TeXML `<Pay>`,\s+the Voice API, and AI Assistants/);
          assert.match(
            twilioSwitch,
            /<Record>` defaults to dual[\s\S]*<Dial recordingChannels>` defaults to single/i,
            'Developer Kit migration guidance must distinguish recording defaults by TeXML surface',
          );
          assert.match(
            twilioVoiceMigration,
            /<Record channels>` defaults to `dual`[\s\S]*<Dial recordingChannels>` defaults to `single`/i,
            'Bundled migration guidance must agree with the current TeXML recording defaults',
          );
          assert.match(
            texmlVerbs,
            /^\| `recordingChannels` \| string \| `single` \|/m,
            'The TeXML Dial reference must document the single-channel default',
          );
          assert.doesNotMatch(
            texmlValidator,
            /<Dial record=.*defaults to dual-channel/i,
            'The migration validator must not report the obsolete Dial dual-channel default',
          );

          for (const text of [architecturePatterns, quickstart]) {
            assert.match(text, /application\/x-www-form-urlencoded/);
            assert.match(text, /data\.id/);
            assert.match(text, /CallSid|TeXML identifiers/);
          }
          assert.match(twilioSwitch, /application\/x-www-form-urlencoded/);
          assert.match(twilioSwitch, /data\.\*/);
          assert.doesNotMatch(debugging, /18-verb/);
          assert.doesNotMatch(twilioSwitch, /no backend token service required/);
          assert.match(twilioSwitch, /generate JWTs on your backend/);

          for (const [label, pattern] of [
            ['10DLC', /10DLC/],
            ['toll-free verification', /toll-free verification/],
            ['short codes', /short\s+codes?/],
          ]) {
            assert.match(productNavigator, pattern, `Sender guidance must distinguish ${label}`);
          }

          for (const requiredValue of [
            '`list_api_endpoints`',
            '`get_api_endpoint_schema`',
            '`invoke_api_endpoint`',
          ]) {
            assert.ok(builder.includes(requiredValue), `Builder guidance must include ${requiredValue}`);
          }
          assert.match(builder, /For live API work/i);
          NODE

  skills-sync-check:
    name: Check — Skills in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify provider skill directories match source
        run: ./scripts/check-skills-sync.sh

  skill-count-check:
    name: Check — Skill-count markers current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify SKILL_COUNT markers match on-disk count
        run: ./scripts/check-skill-count.sh

  unit-tests:
    name: Unit Tests (no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Python unit tests
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python deps
        working-directory: tools/python
        run: pip install -e ".[dev]"
      - name: Python unit tests
        working-directory: tools/python
        run: pytest tests/test_tools.py tests/test_configuration.py tests/test_api_client.py tests/test_openai_toolkit.py tests/test_langchain_toolkit.py tests/test_crewai_toolkit.py tests/test_shared_schema.py tests/test_x402.py tests/test_rcs_call_control_tools.py -v

      # TypeScript compilation
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install TS SDK deps
        working-directory: tools/typescript
        run: npm ci
      - name: TypeScript SDK compilation
        working-directory: tools/typescript
        run: npx tsc --noEmit
      - name: TypeScript adapter contract tests
        working-directory: tools/typescript
        run: npx tsx tests/rcs-call-control.test.ts && npx tsx tests/adapter-anyof.test.ts
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: CLI compilation
        working-directory: cli
        run: npx tsc --noEmit
      - name: CLI unit tests
        working-directory: cli
        run: npm test

      # Cross-package parity
      - name: Cross-package parity check
        run: |
          PY_TOOLS=$(cd tools/python && python3 -c "
          from telnyx_agent_toolkit.shared.constants import TOOL_DEFINITIONS
          print('\n'.join(sorted(TOOL_DEFINITIONS)))
          ")
          TS_TOOLS=$(cd tools/typescript && npx tsx -e "
          import { TOOL_DEFINITIONS } from './src/shared/constants.ts';
          console.log(Object.keys(TOOL_DEFINITIONS).sort().join('\n'));
          ")
          if [ "$PY_TOOLS" != "$TS_TOOLS" ]; then
            echo "MISMATCH! Missing from TypeScript:"
            comm -23 <(printf '%s\n' "$PY_TOOLS") <(printf '%s\n' "$TS_TOOLS")
            echo "MISMATCH! Missing from Python:"
            comm -13 <(printf '%s\n' "$PY_TOOLS") <(printf '%s\n' "$TS_TOOLS")
            exit 1
          fi
          TOOL_COUNT=$(printf '%s\n' "$PY_TOOLS" | wc -l | tr -d ' ')
          echo "✅ Python and TypeScript SDKs have identical tool sets ($TOOL_COUNT tools each)"

      # Guide structural tests
      - name: Guide structural tests
        run: npx tsx --test tests/guides.test.ts

  api-readonly:
    name: API Read-Only Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Python read-only
      - name: Install Python deps
        working-directory: tools/python
        run: pip install -e ".[dev]"
      - name: Python API read-only tests
        working-directory: tools/python
        run: pytest tests/test_integration_ci.py -v -k "readonly"

      # TS SDK read-only
      - name: Install TS SDK deps
        working-directory: tools/typescript
        run: npm ci
      - name: TS SDK API read-only tests
        working-directory: tools/typescript
        run: npx tsx tests/integration-ci.test.ts

      # Install Go CLI (telnyx-cli)
      - name: Install telnyx CLI (Go)
        run: |
          curl -fsSL -o /tmp/telnyx.tar.gz https://github.com/team-telnyx/telnyx-cli/releases/download/v0.11.0/telnyx_0.11.0_linux_amd64.tar.gz
          tar -xzf /tmp/telnyx.tar.gz -C /usr/local/bin telnyx
          chmod +x /usr/local/bin/telnyx
          telnyx --version

      # CLI read-only
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: CLI read-only tests
        working-directory: cli
        run: npx tsx tests/integration-ci.test.ts

      # Guide API smoke tests
      - name: Guide API smoke tests
        run: npx tsx --test tests/guides-api.test.ts
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}

  api-write:
    name: API Write + Cleanup Tests (Telnyx network)
    runs-on: telnyx-2xsmall
    needs: api-readonly
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_write_tests == 'true')
    env:
      TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
      RUN_WRITE_TESTS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Python write tests
      - name: Install Python deps
        working-directory: tools/python
        run: pip install -e ".[dev]"
      - name: Python API write tests
        continue-on-error: true
        working-directory: tools/python
        run: pytest tests/test_integration_ci.py -v -k "write"

      # TS SDK write tests
      - name: Install TS SDK deps
        working-directory: tools/typescript
        run: npm ci
      - name: TS SDK write tests
        continue-on-error: true
        working-directory: tools/typescript
        run: RUN_WRITE_TESTS=true npx tsx tests/integration-ci.test.ts

      # Install Go CLI (telnyx-cli)
      - name: Install telnyx CLI (Go)
        run: |
          curl -fsSL -o /tmp/telnyx.tar.gz https://github.com/team-telnyx/telnyx-cli/releases/download/v0.11.0/telnyx_0.11.0_linux_amd64.tar.gz
          tar -xzf /tmp/telnyx.tar.gz -C /usr/local/bin telnyx
          chmod +x /usr/local/bin/telnyx
          telnyx --version

      # CLI write tests
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: CLI write tests
        continue-on-error: true
        working-directory: cli
        run: RUN_WRITE_TESTS=true npx tsx tests/integration-ci-write.test.ts
