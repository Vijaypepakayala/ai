name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_write_tests:
        description: 'Run write tests (creates and cleans up real resources)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  claude-plugin-check:
    name: Check — Claude Developer Kit contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate marketplace and Developer Kit plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.97 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.97 plugin validate providers/claude/plugins/telnyx-developer-kit
      - name: Verify Developer Kit contracts
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const childProcess = require('node:child_process');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const scannerUnitTests = childProcess.spawnSync(
            'python3',
            ['./skills/telnyx-twilio-migration/scripts/test-scan-twilio-deep.py'],
            { encoding: 'utf8' },
          );
          assert.equal(
            scannerUnitTests.status,
            0,
            scannerUnitTests.stderr || scannerUnitTests.stdout,
          );
          const manifest = require('./providers/claude/plugins/telnyx-developer-kit/.claude-plugin/plugin.json');
          const builder = fs.readFileSync(
            './providers/claude/plugins/telnyx-developer-kit/agents/telnyx-builder.md',
            'utf8',
          );
          const architecturePatterns = fs.readFileSync(
            './skills/telnyx-kit-architecture-patterns/SKILL.md',
            'utf8',
          );
          const productNavigator = fs.readFileSync(
            './skills/telnyx-kit-product-navigator/SKILL.md',
            'utf8',
          );
          const twilioSwitch = fs.readFileSync(
            './skills/telnyx-kit-twilio-switch/SKILL.md',
            'utf8',
          );
          const twilioVoiceMigration = fs.readFileSync(
            './skills/telnyx-twilio-migration/references/voice-migration.md',
            'utf8',
          );
          const payOverVoice = fs.readFileSync(
            './skills/telnyx-twilio-migration/references/pay-over-voice.md',
            'utf8',
          );
          const twilioMigration = fs.readFileSync(
            './skills/telnyx-twilio-migration/SKILL.md',
            'utf8',
          );
          const productMapping = fs.readFileSync(
            './skills/telnyx-twilio-migration/references/product-mapping.md',
            'utf8',
          );
          const unsupportedProducts = fs.readFileSync(
            './skills/telnyx-twilio-migration/references/unsupported-products.md',
            'utf8',
          );
          const errorCodeMapping = fs.readFileSync(
            './skills/telnyx-twilio-migration/references/error-code-mapping.md',
            'utf8',
          );
          const texmlVerbs = fs.readFileSync(
            './skills/telnyx-twilio-migration/references/texml-verbs.md',
            'utf8',
          );
          const texmlValidator = fs.readFileSync(
            './skills/telnyx-twilio-migration/scripts/validate-texml.sh',
            'utf8',
          );
          const migrationValidator = fs.readFileSync(
            './skills/telnyx-twilio-migration/scripts/validate-migration.sh',
            'utf8',
          );
          const correctnessLinter = fs.readFileSync(
            './skills/telnyx-twilio-migration/scripts/lint-telnyx-correctness.sh',
            'utf8',
          );
          const quickstart = fs.readFileSync(
            './skills/telnyx-kit-quickstart/SKILL.md',
            'utf8',
          );
          const debugging = fs.readFileSync(
            './skills/telnyx-kit-debugging/SKILL.md',
            'utf8',
          );
          const rootReadme = fs.readFileSync('./README.md', 'utf8');
          const skillsReadme = fs.readFileSync('./skills/README.md', 'utf8');
          const pluginChooser = fs.readFileSync('./plugins/README.md', 'utf8');
          const pluginRoot = './providers/claude/plugins';
          const countPluginSkills = (plugin) => fs.readdirSync(
            `${pluginRoot}/${plugin}/skills`,
            { withFileTypes: true },
          ).filter((entry) => entry.isDirectory()).length;
          const packagedPlugins = fs.readdirSync(pluginRoot, { withFileTypes: true })
            .filter((entry) => entry.isDirectory() && entry.name.startsWith('telnyx-'))
            .map((entry) => entry.name)
            .sort();
          const apiKey = manifest.userConfig?.telnyx_api_key;
          const mcp = manifest.mcpServers?.telnyx;

          assert.equal(apiKey?.required, true, 'telnyx_api_key must remain required');
          assert.equal(apiKey?.sensitive, true, 'telnyx_api_key must remain sensitive');
          assert.equal(mcp?.type, 'http');
          assert.equal(mcp?.url, 'https://api.telnyx.com/v2/mcp');
          assert.equal(
            mcp?.headers?.Authorization,
            'Bearer ${user_config.telnyx_api_key}',
            'Telnyx MCP must receive the configured API key as a Bearer token',
          );

          assert.doesNotMatch(
            architecturePatterns,
            /telnyx-public-key/i,
            'The Telnyx public key is configuration, not a webhook request header',
          );
          for (const requiredValue of [
            '`telnyx-signature-ed25519`',
            '`telnyx-timestamp`',
            '`TELNYX_PUBLIC_KEY`',
          ]) {
            assert.ok(
              architecturePatterns.includes(requiredValue),
              `Webhook verification guidance must include ${requiredValue}`,
            );
          }
          assert.doesNotMatch(
            architecturePatterns,
            /messaging profile[^\n]*(?:OTP|2FA)/i,
            'OTP and 2FA must not be presented as raw Messaging traffic classes',
          );
          assert.match(
            architecturePatterns,
            /Route OTP and 2FA through the Verify API with a Verify profile/i,
            'OTP and 2FA architecture guidance must route through Verify',
          );

          const navigatorSkillRoutes = {
            'Send SMS/MMS notifications': ['telnyx-messaging-curl'],
            'Verify users by OTP (SMS, call, flash call)': ['telnyx-verify-curl'],
            'Send WhatsApp messages': ['telnyx-whatsapp-curl'],
            'Send or receive email': ['telnyx-email-curl', 'telnyx-email-inbound-curl'],
            'Serve voice menus / IVR from XML': ['telnyx-texml-curl'],
            'Drive calls imperatively from code (AI agents, dynamic flows)': ['telnyx-voice-curl'],
            'Build a browser/mobile softphone': ['telnyx-webrtc-client-js'],
            'Real-time media into your AI model': ['telnyx-voice-streaming-curl'],
            'Speech-to-text / text-to-speech': ['telnyx-stt-python', 'telnyx-tts-python'],
            'Buy, configure, port numbers': ['telnyx-numbers-curl'],
            'Look up carrier/caller data for a number': ['telnyx-numbers-services-curl'],
            'Send/receive fax': ['telnyx-fax-curl'],
            'Connect a PBX/SIP system': ['telnyx-sip-curl'],
            'Cellular connectivity for devices': ['telnyx-iot-curl'],
            'Video rooms': ['telnyx-video-curl'],
            'Move an existing Twilio app': ['telnyx-twilio-migration'],
          };
          const navigatorRows = productNavigator.split('\n');
          for (const [label, skills] of Object.entries(navigatorSkillRoutes)) {
            const row = navigatorRows.find((line) => line.startsWith(`| ${label} |`));
            assert.ok(row, `The product navigator must include the ${label} row`);
            for (const skill of skills) {
              const owners = packagedPlugins.filter((plugin) => fs.existsSync(
                `${pluginRoot}/${plugin}/skills/${skill}`,
              ));
              assert.equal(owners.length, 1, `${skill} must have exactly one plugin owner`);
              assert.ok(
                row.includes(owners[0]),
                `${label} must point to ${owners[0]}, which owns ${skill}`,
              );
            }
          }
          const messagingRow = navigatorRows.find(
            (line) => line.startsWith('| Send SMS/MMS notifications |'),
          );
          const verifyRow = navigatorRows.find(
            (line) => line.startsWith('| Verify users by OTP'),
          );
          assert.doesNotMatch(
            messagingRow,
            /\b(?:2FA|OTP)\b/i,
            'OTP and 2FA requests must not be routed to raw Messaging',
          );
          assert.match(
            verifyRow,
            /\bOTP\b/i,
            'OTP requests must remain routed to Verify',
          );
          const faxNavigatorRow = navigatorRows.find(
            (line) => line.startsWith('| Send/receive fax |'),
          );
          for (const requiredValue of [
            'POST /v2/faxes',
            'POST /v2/fax_applications',
            'PATCH /v2/phone_numbers/{id}',
            'connection_id',
          ]) {
            assert.ok(
              faxNavigatorRow.includes(requiredValue),
              `Fax navigation must include ${requiredValue} for complete send/receive setup`,
            );
          }

          const quickstartRows = quickstart.split('\n');
          const provisioningContracts = {
            'Send/receive SMS': [
              'PATCH /v2/phone_numbers/{id}/messaging',
              'messaging profile',
            ],
            'Receive calls to your app': [
              'PATCH /v2/phone_numbers/{id}',
              'connection_id',
            ],
            'Make outbound calls': [
              'PATCH /v2/call_control_applications/{id}',
              'PATCH /v2/texml_applications/{id}',
              'PATCH /v2/{credential\\|fqdn\\|ip}_connections/{id}',
              'outbound.outbound_voice_profile_id',
            ],
            'Send US A2P SMS': [
              '10DLC',
              'toll-free verification',
              'short-code approval',
            ],
            'Send/receive fax': [
              'POST /v2/fax_applications',
              'PATCH /v2/phone_numbers/{id}',
              'connection_id',
              'outbound.outbound_voice_profile_id',
            ],
          };
          for (const [label, requiredValues] of Object.entries(provisioningContracts)) {
            const row = quickstartRows.find((line) => line.startsWith(`| ${label} |`));
            assert.ok(row, `The quickstart must include the ${label} provisioning row`);
            for (const requiredValue of requiredValues) {
              assert.ok(
                row.includes(requiredValue),
                `${label} provisioning must include ${requiredValue}`,
              );
            }
          }
          const inboundVoiceRow = quickstartRows.find(
            (line) => line.startsWith('| Receive calls to your app |'),
          );
          assert.doesNotMatch(
            inboundVoiceRow,
            /phone_numbers\/\{id\}\/voice/,
            'connection_id belongs on the base phone-number PATCH, not voice settings',
          );
          assert.doesNotMatch(
            quickstart,
            /webhook URL[^\n]*not per request/i,
            'Quickstart must not deny supported per-request webhook overrides',
          );
          assert.match(
            quickstart,
            /per-request override only when that endpoint explicitly supports one[\s\S]*Messaging `webhook_url`/i,
            'Quickstart must explain the Messaging webhook override exception',
          );

          assert.doesNotMatch(
            debugging,
            /webhook URL[^\n]*not per-request/i,
            'Debugging guidance must not deny supported per-request webhook overrides',
          );
          assert.match(
            debugging,
            /Messaging send requests can set[\s\S]*`webhook_url`\/`webhook_failover_url`[\s\S]*priority over the profile/i,
            'Debugging guidance must preserve Messaging webhook override precedence',
          );

          assert.doesNotMatch(
            debugging,
            /HTTP 5xx[^\n]*Yes\s*[—-]\s*bounded backoff/i,
            '5xx guidance must not blindly retry mutations with an unknown outcome',
          );
          assert.match(
            debugging,
            /mutation outcome may be unknown[\s\S]*same `command_id`[\s\S]*reconcile the outcome/i,
            '5xx guidance must make mutation retries conditional on documented idempotency',
          );
          assert.match(
            architecturePatterns,
            /distinct primary and failover webhook[\s\S]*same durable deduplication store/i,
            'Critical webhook paths must preserve independent failover delivery and shared deduplication',
          );
          assert.doesNotMatch(
            architecturePatterns,
            /One public webhook endpoint per app/i,
            'Architecture guidance must not collapse primary and failover delivery into one endpoint',
          );
          assert.match(
            architecturePatterns,
            /Dedupe API v2 webhooks on the event\s+`data\.id`[\s\S]*`data\.payload\.id` only to correlate/i,
            'Webhook idempotency must use the event ID and reserve message IDs for correlation',
          );
          assert.doesNotMatch(
            architecturePatterns,
            /message [`]?id[`]? dedupe/i,
            'Message IDs must not suppress distinct messaging lifecycle events',
          );
          assert.match(
            debugging,
            /synchronous send[\s\S]*`40300`[\s\S]*STOP[\s\S]*asynchronous[\s\S]*`message\.finalized`[\s\S]*phase plus `title` and `detail`/i,
            'STOP handling must distinguish synchronous blocks from async delivery errors',
          );
          assert.doesNotMatch(
            debugging,
            /^\| 40300 \| Blocked by STOP\/org compliance \|/m,
            'A bare 40300 must not be classified as STOP without response context',
          );
          assert.match(
            quickstart,
            /number_orders\/\$ORDER_ID[\s\S]*\.data\.status[\s\S]*failure\|cancelled\|deleted[\s\S]*pending[\s\S]*not active[\s\S]*status is `success`/i,
            'Quickstart must wait for asynchronous number activation before provisioning',
          );
          assert.match(
            quickstart,
            /--data-urlencode "filter\[phone_number\]=\+1\.\.\."/,
            'Phone-number lookup must preserve brackets and the E.164 plus sign',
          );
          assert.doesNotMatch(
            quickstart,
            /GET \/v2\/phone_numbers\?filter\[phone_number\]=\+1/,
            'Quickstart must not publish a curl-unsafe raw phone-number query',
          );

          for (const [label, text] of [
            ['Developer Kit Twilio switch', twilioSwitch],
            ['migration skill', twilioMigration],
            ['product mapping', productMapping],
            ['unsupported-products reference', unsupportedProducts],
            ['TeXML verb reference', texmlVerbs],
            ['TeXML validator', texmlValidator],
          ]) {
            assert.doesNotMatch(
              text,
              /(?:Twilio Pay|<Pay>)[^\n]*(?:no (?:direct )?(?:Telnyx )?equivalent|not supported|unsupported)/i,
              `${label} must not retain obsolete unsupported Pay guidance`,
            );
          }
          for (const requiredValue of [
            'TeXML `<Pay>`',
            'Payment Connector',
            'https://developers.telnyx.com/docs/voice/programmable-voice/pay',
          ]) {
            assert.ok(
              twilioSwitch.includes(requiredValue),
              `Twilio migration guidance must include ${requiredValue}`,
            );
          }
          assert.match(
            twilioMigration,
            /Supported products[^\n]*\bpay\b/i,
            'The migration skill must route detected Pay usage into migration',
          );
          assert.doesNotMatch(
            twilioMigration,
            /Unsupported products[^\n]*\bPay\b/i,
            'The migration skill must not keep Pay on Twilio',
          );
          assert.match(
            twilioMigration,
            /\| `pay` \| Voice API or TeXML Pay over Voice \|[^\n]*pay-over-voice\.md[^\n]*texml-verbs\.md[^\n]*No generated Pay SDK reference[^\n]*do not invent an SDK method/,
            'The per-product loop must route API Pay to the exact REST reference instead of an absent SDK method',
          );
          assert.match(
            twilioMigration,
            /\| `pay` \| `\{baseDir\}\/references\/pay-over-voice\.md`, plus `\{baseDir\}\/references\/texml-verbs\.md` for XML flows \|/,
            'Phase 2 planning must distinguish API Pay from TeXML Pay',
          );
          assert.match(payOverVoice, /POST \/v2\/calls\/\{call_control_id\}\/actions\/pay/);
          assert.doesNotMatch(payOverVoice, /call_control_id\}\/pay/);
          assert.match(payOverVoice, /"amount": 10\.00/);
          assert.match(payOverVoice, /"transaction_type": "charge"/);
          assert.match(payOverVoice, /transaction_type` to `tokenize`[\s\S]*omit `amount`/);
          assert.match(payOverVoice, /do not invent one/i);
          assert.match(payOverVoice, /call\.payment\.progress[\s\S]*call\.payment\.completed/);
          for (const directApiField of [
            'max_attempts',
            'timeout_millis',
            'inter_digit_timeout_millis',
            'service_level',
            'client_state',
          ]) {
            assert.ok(
              payOverVoice.includes(`\`${directApiField}\``),
              `Direct Pay reference must document ${directApiField}`,
            );
          }
          assert.match(texmlValidator, /SUPPORTED_VERBS="[^"]*\bPay\b[^"]*"/);
          assert.doesNotMatch(texmlValidator, /UNSUPPORTED_VERBS="[^"]*\bPay\b[^"]*"/);
          assert.match(productMapping, /Twilio Pay \/ `<Pay>`[^\n]*Pay over Voice/);
          assert.match(productMapping, /Pay over Voice[^\n]*pay-over-voice\.md[^\n]*voice-migration\.md[^\n]*texml-verbs\.md/);
          assert.match(texmlVerbs, /^### `<Pay>` — Collect or Tokenize Payment Details$/m);
          const paySection = texmlVerbs.match(
            /^### `<Pay>` — Collect or Tokenize Payment Details[\s\S]*?(?=^### |(?![\s\S]))/m,
          )?.[0] ?? '';
          for (const supportedAttribute of [
            'action',
            'method',
            'statusCallback',
            'statusCallbackMethod',
            'paymentConnector',
            'chargeAmount',
            'currency',
            'paymentToken',
            'paymentMethod',
            'postalCode',
            'minPostalCodeLength',
            'validCardTypes',
            'transactionType',
            'description',
            'maxAttempts',
            'timeout',
            'interDigitTimeout',
            'voice',
            'language',
            'serviceLevel',
            'parameters',
            'prompts',
            'metadata',
          ]) {
            assert.ok(
              paySection.includes(`\`${supportedAttribute}\``),
              `Pay reference must document ${supportedAttribute}`,
            );
          }
          assert.match(paySection, /<Parameter name=/);
          assert.match(paySection, /<Prompt for=[\s\S]*<Say>/);
          assert.match(paySection, /call_payment_progress[\s\S]*call_payment_completed/);

          const payFixtureRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'telnyx-pay-contract-'));
          try {
            const payFixture = path.join(payFixtureRoot, 'pay.xml');
            fs.writeFileSync(
              payFixture,
              '<Response><Pay action="/done" method="POST" statusCallback="/events" statusCallbackMethod="POST" paymentConnector="Default" chargeAmount="10.00" currency="USD" paymentMethod="credit-card" postalCode="true" minPostalCodeLength="5" validCardTypes="visa mastercard" transactionType="charge" maxAttempts="2" timeout="10" interDigitTimeout="5" serviceLevel="premium" parameters="{}" prompts="{}" metadata="{}"><Parameter name="order_id" value="123"/><Prompt for="payment-card-number" attempt="1 2" cardType="visa"><Say>Enter card.</Say></Prompt></Pay></Response>',
            );
            const payValidation = childProcess.spawnSync(
              'bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', payFixture],
              { encoding: 'utf8' },
            );
            assert.equal(payValidation.status, 0, payValidation.stderr || payValidation.stdout);
            assert.match(payValidation.stdout, /<Pay> — Supported/);
            assert.match(payValidation.stdout, /Payment Connector/);
            const dynamicPayFixture = path.join(payFixtureRoot, 'dynamic-pay.xml');
            fs.writeFileSync(
              dynamicPayFixture,
              '<Response><Pay paymentConnector="{connector}" chargeAmount="{amount}" maxAttempts="{attempts}"/></Response>',
            );
            const dynamicPayValidation = childProcess.spawnSync(
              'bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', dynamicPayFixture],
              { encoding: 'utf8' },
            );
            assert.equal(
              dynamicPayValidation.status,
              0,
              dynamicPayValidation.stderr || dynamicPayValidation.stdout,
            );

            const noPythonBin = path.join(payFixtureRoot, 'no-python-bin');
            fs.mkdirSync(noPythonBin);
            fs.symlinkSync('/usr/bin/head', path.join(noPythonBin, 'head'));
            fs.symlinkSync('/usr/bin/grep', path.join(noPythonBin, 'grep'));
            fs.symlinkSync('/usr/bin/awk', path.join(noPythonBin, 'awk'));
            const noPythonValidation = childProcess.spawnSync(
              '/bin/bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', payFixture],
              { encoding: 'utf8', env: { ...process.env, PATH: noPythonBin } },
            );
            assert.equal(noPythonValidation.status, 1, noPythonValidation.stderr || noPythonValidation.stdout);
            assert.match(noPythonValidation.stdout, /python3 is required for fail-closed Pay attribute validation/);
            assert.doesNotMatch(noPythonValidation.stdout, /\[OK\]\s+<Pay>/);

            const paymentFixture = path.join(payFixtureRoot, 'payment.xml');
            fs.writeFileSync(paymentFixture, '<Response><Payment>ok</Payment></Response>');
            const paymentValidation = childProcess.spawnSync(
              'bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', paymentFixture],
              { encoding: 'utf8' },
            );
            assert.equal(paymentValidation.status, 0, paymentValidation.stderr || paymentValidation.stdout);
            assert.doesNotMatch(paymentValidation.stdout, /<Pay>/);
            const commentedPaymentFixture = path.join(payFixtureRoot, 'commented-payment.xml');
            fs.writeFileSync(
              commentedPaymentFixture,
              '<Response><!-- <Pay paymentConnector="Default"/> --><Say>Hi</Say></Response>',
            );
            const commentedPaymentValidation = childProcess.spawnSync(
              'bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', commentedPaymentFixture],
              { encoding: 'utf8' },
            );
            assert.equal(
              commentedPaymentValidation.status,
              0,
              commentedPaymentValidation.stderr || commentedPaymentValidation.stdout,
            );
            assert.doesNotMatch(commentedPaymentValidation.stdout, /<Pay>/);
            for (const [label, attributes, errorPattern] of [
              ['mis-cased connector', 'PaymentConnector="Default"', /unknown or mis-cased attribute/],
              ['unsupported method', 'paymentMethod="bitcoin"', /credit-card or ach-debit/],
              ['negative amount', 'chargeAmount="-1"', /non-negative decimal string/],
              ['zero inferred amount', 'chargeAmount="0"', /greater than zero/],
              ['unsupported currency', 'currency="EUR"', /currency must be USD/],
              ['unsupported transaction', 'transactionType="refund"', /transactionType must be charge or tokenize/],
              ['charge without amount', 'transactionType="charge"', /requires chargeAmount/],
              ['too many attempts', 'maxAttempts="4"', /maxAttempts must be an integer from 1 through 3/],
              ['invalid callback method', 'statusCallbackMethod="PUT"', /statusCallbackMethod must be GET or POST/],
              ['invalid JSON', 'metadata="[]"', /metadata must be a JSON object/],
              ['blank postal code', 'postalCode=""', /postalCode must not be blank/],
              ['short postal-code minimum', 'minPostalCodeLength="0"', /at least 1/],
              ['unsupported card type', 'validCardTypes="visa unionpay"', /supported card types/],
            ]) {
              const invalidPay = path.join(payFixtureRoot, `invalid-${label.replaceAll(' ', '-')}.xml`);
              fs.writeFileSync(invalidPay, `<Response><Pay ${attributes}/></Response>`);
              const invalidValidation = childProcess.spawnSync(
                'bash',
                ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', invalidPay],
                { encoding: 'utf8' },
              );
              assert.equal(invalidValidation.status, 1, invalidValidation.stderr || invalidValidation.stdout);
              assert.match(invalidValidation.stdout, errorPattern);
              assert.doesNotMatch(invalidValidation.stdout, /\[OK\]\s+<Pay>/);
            }
            const invalidPromptCardType = path.join(payFixtureRoot, 'invalid-prompt-card-type.xml');
            fs.writeFileSync(
              invalidPromptCardType,
              '<Response><Pay paymentConnector="Default"><Prompt for="payment-card-number" cardType="bitcoin"><Say>Card</Say></Prompt></Pay></Response>',
            );
            const invalidPromptCardTypeValidation = childProcess.spawnSync(
              'bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', invalidPromptCardType],
              { encoding: 'utf8' },
            );
            assert.equal(
              invalidPromptCardTypeValidation.status,
              1,
              invalidPromptCardTypeValidation.stderr || invalidPromptCardTypeValidation.stdout,
            );
            assert.match(
              invalidPromptCardTypeValidation.stdout,
              /Prompt cardType must name a supported card type/,
            );
            const nestedPay = path.join(payFixtureRoot, 'nested-pay.xml');
            fs.writeFileSync(
              nestedPay,
              '<Response><Gather><Pay paymentConnector="Default"/></Gather></Response>',
            );
            const nestedPayValidation = childProcess.spawnSync(
              'bash',
              ['./skills/telnyx-twilio-migration/scripts/validate-texml.sh', nestedPay],
              { encoding: 'utf8' },
            );
            assert.equal(
              nestedPayValidation.status,
              1,
              nestedPayValidation.stderr || nestedPayValidation.stdout,
            );
            assert.match(nestedPayValidation.stdout, /direct child of the Response root/);
            assert.doesNotMatch(nestedPayValidation.stdout, /\[OK\]\s+<Pay>/);
            for (const [name, body, errorPattern] of [
              [
                'unsupported-prompt-child',
